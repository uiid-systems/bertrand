name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # --timeout: several tests spawn real processes (hook scripts, adopt,
      # process identity); the default 5s per-test budget flaked on loaded
      # runners.
      - run: bun test --timeout 20000

