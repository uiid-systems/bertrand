name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      # Node 24, not 22: trusted publishing needs npm >= 11.5.1, and no Node 22
      # release ever bundled it (22.x caps at npm 10.9.8). Do NOT lower this —
      # publishing authenticates over OIDC and silently has no token to fall
      # back to, so an older npm fails the release outright.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # --timeout: match the test workflow — process-spawning workspace tests
      # need more than the default 5s budget on loaded runners.
      - run: bun test --timeout 20000
      # No NODE_AUTH_TOKEN: this authenticates via OIDC against the trusted
      # publisher registered for `bertrand` on npmjs.com (provider: GitHub
      # Actions, workflow: release-please.yml). Renaming this file breaks the
      # release until the publisher is re-registered under the new name.
      # --provenance is likewise gone: trusted publishing attests automatically.
      - run: npm publish --access public
